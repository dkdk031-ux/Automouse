name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/autotouch.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotouch-debug-apk
          path: out/autotouch.apk
          if-no-files-found: error

      # 휴대폰에서 바로 받을 수 있도록 'latest' 릴리스에 APK 를 올린다.
      # → https://github.com/<계정>/<저장소>/releases/latest 에서 탭 한 번으로 설치
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드 (autotouch.apk)
          body: |
            `main` 브랜치 최신 커밋으로 자동 빌드된 디버그 APK 입니다.
            아래 `autotouch.apk` 를 휴대폰에서 눌러 바로 설치하세요.

            커밋: ${{ github.sha }}
          files: out/autotouch.apk
          make_latest: true
